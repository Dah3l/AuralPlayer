name: Release firmada

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release (ej. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/aural-release.jks"

      - name: Build release firmado
        env:
          AURAL_KEYSTORE_PATH: ${{ runner.temp }}/aural-release.jks
          AURAL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AURAL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AURAL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: AuralPlayer ${{ inputs.version }}
          files: app/build/outputs/apk/release/app-release.apk
